<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">AnGo Companion for Obsidian</title>
  <desc id="desc">A dark Obsidian-inspired validation panel with passing command cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171717"/>
      <stop offset="0.55" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="520" rx="32" fill="url(#bg)"/>
  <rect x="84" y="70" width="1232" height="380" rx="18" fill="#111827" stroke="#374151" stroke-width="2"/>
  <rect x="84" y="70" width="1232" height="62" rx="18" fill="#1f2937"/>
  <circle cx="122" cy="101" r="9" fill="#ef4444"/>
  <circle cx="152" cy="101" r="9" fill="#f59e0b"/>
  <circle cx="182" cy="101" r="9" fill="#22c55e"/>
  <text x="240" y="108" fill="#f9fafb" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">AnGo Companion</text>
  <rect x="1080" y="86" width="94" height="30" rx="6" fill="#064e3b"/>
  <text x="1106" y="107" fill="#86efac" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Passed</text>
  <text x="140" y="197" fill="#f9fafb" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="800">Validate your vault without leaving Obsidian</text>
  <text x="142" y="250" fill="#d1d5db" font-family="Inter, Arial, sans-serif" font-size="24">Read-only current-note and changed-file checks for AnGo-style vaults.</text>
  <rect x="142" y="304" width="330" height="80" rx="10" fill="#18212f" stroke="#374151"/>
  <rect x="164" y="329" width="48" height="30" rx="6" fill="#064e3b"/>
  <text x="177" y="351" fill="#86efac" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">OK</text>
  <text x="232" y="338" fill="#f9fafb" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700">Vault validation</text>
  <text x="232" y="365" fill="#9ca3af" font-family="Menlo, monospace" font-size="15">python3 validate_vault.py</text>
  <rect x="500" y="304" width="360" height="80" rx="10" fill="#18212f" stroke="#374151"/>
  <rect x="522" y="329" width="48" height="30" rx="6" fill="#064e3b"/>
  <text x="535" y="351" fill="#86efac" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">OK</text>
  <text x="590" y="338" fill="#f9fafb" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700">Workflow validation</text>
  <text x="590" y="365" fill="#9ca3af" font-family="Menlo, monospace" font-size="15">python3 validate_workflow.py</text>
  <rect x="142" y="410" width="718" height="8" rx="4" fill="url(#accent)"/>
</svg>
